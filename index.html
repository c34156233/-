<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>哈基米反應速度打靶遊戲</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont;
      background: #ffeef5;
      display: flex;
      height: 100vh;
    }

    .game-container {
      flex: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .sidebar {
      flex: 2;
      background: #fff7ff;
      border-left: 3px solid #ffb6d9;
      padding: 16px;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 16px;
      color: #ff4f8b;
      text-shadow: 1px 1px 0 #fff;
    }

    .status-text {
      font-size: 20px;
      margin: 12px 0;
      color: #444;
    }

    .controls {
      margin: 12px 0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      border: none;
      padding: 8px 14px;
      border-radius: 999px;
      background: #ff4f8b;
      color: white;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 2px 0 #d63b6c;
      transition: transform 0.1s, box-shadow 0.1s, background 0.2s;
    }

    button:hover {
      background: #ff6fa0;
      transform: translateY(-1px);
      box-shadow: 0 3px 0 #d63b6c;
    }

    button:active {
      transform: translateY(1px);
      box-shadow: 0 1px 0 #d63b6c;
    }

    .difficulty-button {
      background: #ffd2e6;
      color: #ff2f73;
      box-shadow: 0 2px 0 #f3a9c7;
    }

    .difficulty-button.active {
      background: #ff4f8b;
      color: white;
      box-shadow: 0 2px 0 #d63b6c;
    }

    .play-area {
      width: 80%;
      height: 60%;
      max-width: 600px;
      max-height: 400px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 8px 0 #ffc3dd;
      position: relative;
      overflow: hidden;
      border: 3px dashed #ffb6d9;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hint-text {
      color: #888;
      font-size: 16px;
      text-align: center;
      padding: 0 16px;
    }

    .target {
      position: absolute;
      cursor: pointer;
      user-select: none;
      transition: transform 0.05s;
    }

    .target:active {
      transform: scale(0.95);
    }

    .target img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .sidebar h2 {
      margin-top: 0;
      color: #ff4f8b;
    }

    .stat-block {
      margin-bottom: 12px;
      padding: 8px 10px;
      border-radius: 12px;
      background: #ffe3f2;
    }

    .stat-label {
      font-size: 13px;
      color: #777;
    }

    .stat-value {
      font-size: 18px;
      font-weight: bold;
      color: #ff2f73;
    }

    .list-title {
      font-size: 14px;
      margin-top: 8px;
      margin-bottom: 4px;
      color: #555;
    }

    .record-list,
    .best-list {
      list-style: none;
      padding-left: 0;
      margin: 0;
      font-size: 13px;
      max-height: 160px;
      overflow-y: auto;
    }

    .record-list li,
    .best-list li {
      padding: 4px 6px;
      border-radius: 8px;
      margin-bottom: 4px;
      background: #fff;
      border: 1px solid #ffd2e6;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .record-difficulty {
      font-size: 11px;
      color: #999;
    }

    .record-time {
      font-weight: bold;
      color: #ff2f73;
    }

    .small-note {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>哈基米反應速度打靶遊戲 🎯</h1>
    <div class="status-text" id="statusText">按「開始遊戲」來測試你的反應速度！</div>

    <div class="controls">
      <button id="startButton">開始遊戲</button>
      <button class="difficulty-button active" data-difficulty="easy">Easy</button>
      <button class="difficulty-button" data-difficulty="normal">Normal</button>
      <button class="difficulty-button" data-difficulty="hard">Hard</button>
    </div>

    <div class="play-area" id="playArea">
      <div class="hint-text" id="hintText">
        等待靶出現後，<br />
        盡快點擊哈基米的 GIF！
      </div>
    </div>
  </div>

  <div class="sidebar">
    <h2>排行榜 & 統計 📊</h2>

    <div class="stat-block">
      <div class="stat-label">本次遊戲最快反應時間</div>
      <div class="stat-value" id="currentBest">— ms</div>
    </div>

    <div class="stat-block">
      <div class="stat-label">本次遊戲平均反應時間</div>
      <div class="stat-value" id="currentAverage">— ms</div>
    </div>

    <div class="stat-block">
      <div class="stat-label">歷史最快前 5 名（本機）</div>
      <ul class="best-list" id="bestList"></ul>
      <div class="small-note">資料儲存在瀏覽器 localStorage</div>
    </div>

    <div class="stat-block">
      <div class="list-title">本次遊戲紀錄（時間 + 難度）</div>
      <ul class="record-list" id="recordList"></ul>
    </div>
  </div>

  <script>
    // ====== GIF 清單（你提供的三個） ======
    const gifList = [
      "https://s1.aigei.com/src/img/gif/18/18ee8265ba4e4436b8f78e18dbd0b44b.gif?e=2051020800&token=P7S2Xpzfz11vAkASLTkfHN7Fw-oOZBecqeJaxypL:d2bbGHvJiguLx0MN0AQZZKgFAcY=",
      "https://s1.aigei.com/src/img/gif/80/8058703d3b2445269ea16a8573201087.gif?imageMogr2/auto-orient/thumbnail/!282x320r/gravity/Center/crop/282x320/quality/85/%7CimageView2/2/w/282&e=2051020800&token=P7S2Xpzfz11vAkASLTkfHN7Fw-oOZBecqeJaxypL:51ZWJOWe3fslPdq-HVoe8gThBCE=",
      "https://s1.aigei.com/src/img/gif/fb/fbdf2565b78e47b99c69a4dd75662dfc.gif?e=2051020800&token=P7S2Xpzfz11vAkASLTkfHN7Fw-oOZBecqeJaxypL:xTLGNbSfLzLGxKTitj6fUVIjPXA="
    ];

    // ====== 遊戲狀態 ======
    const playArea = document.getElementById("playArea");
    const statusText = document.getElementById("statusText");
    const hintText = document.getElementById("hintText");
    const startButton = document.getElementById("startButton");
    const difficultyButtons = document.querySelectorAll(".difficulty-button");

    const currentBestEl = document.getElementById("currentBest");
    const currentAverageEl = document.getElementById("currentAverage");
    const bestListEl = document.getElementById("bestList");
    const recordListEl = document.getElementById("recordList");

    let gameState = "idle";
    let currentDifficulty = "easy";
    let targetElement = null;
    let startTime = null;

    let currentSessionRecords = [];

    const STORAGE_KEY = "hakimi_reaction_best";

    // ====== 難度設定 ======
    const difficultyConfig = {
      easy: { label: "Easy", targetSize: 140, waitMin: 2000, waitMax: 2000 },
      normal: { label: "Normal", targetSize: 110, waitMin: 1000, waitMax: 3000 },
      hard: { label: "Hard", targetSize: 80, waitMin: 500, waitMax: 3000 }
    };

    // ====== 工具 ======
    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function loadBestRecords() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (!data) return [];
      try { return JSON.parse(data); } catch { return []; }
    }

    function saveBestRecords(records) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function updateBestListUI() {
      const bestRecords = loadBestRecords();
      bestListEl.innerHTML = "";

      if (bestRecords.length === 0) {
        const li = document.createElement("li");
        li.textContent = "目前沒有紀錄";
        bestListEl.appendChild(li);
        return;
      }

      bestRecords
        .sort((a, b) => a.time - b.time)
        .slice(0, 5)
        .forEach((record, index) => {
          const li = document.createElement("li");
          const left = document.createElement("span");
          const right = document.createElement("span");

          left.textContent = `#${index + 1} ${record.time} ms`;
          right.textContent = record.difficulty;

          li.appendChild(left);
          li.appendChild(right);
          bestListEl.appendChild(li);
        });
    }

    function updateCurrentSessionUI() {
      recordListEl.innerHTML = "";
      if (currentSessionRecords.length === 0) {
        const li = document.createElement("li");
        li.textContent = "尚未有紀錄";
        recordListEl.appendChild(li);
        currentBestEl.textContent = "— ms";
        currentAverageEl.textContent = "— ms";
        return;
      }

      let sum = 0;
      let best = Infinity;

      currentSessionRecords.forEach((record) => {
        sum += record.time;
        if (record.time < best) best = record.time;

        const li = document.createElement("li");
        const timeSpan = document.createElement("span");
        const diffSpan = document.createElement("span");

        timeSpan.className = "record-time";
        timeSpan.textContent = `${record.time} ms`;

        diffSpan.className = "record-difficulty";
        diffSpan.textContent = record.difficulty;

        li.appendChild(timeSpan);
        li.appendChild(diffSpan);
        recordListEl.appendChild(li);
      });

      const avg = Math.round(sum / currentSessionRecords.length);
      currentBestEl.textContent = `${best} ms`;
      currentAverageEl.textContent = `${avg} ms`;
    }

    function addToBestRecords(time, difficulty) {
      const bestRecords = loadBestRecords();
      bestRecords.push({ time, difficulty, timestamp: Date.now() });

      bestRecords.sort((a, b) => a.time - b.time);
      const trimmed = bestRecords.slice(0, 20);
      saveBestRecords(trimmed);
      updateBestListUI();
    }

    // ====== 遊戲流程 ======
    function setDifficulty(diff) {
      currentDifficulty = diff;
      difficultyButtons.forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.difficulty === diff);
      });
    }

    function resetPlayArea() {
      if (targetElement) {
        targetElement.remove();
        targetElement = null;
      }
      hintText.style.display = "block";
    }

    function startGame() {
      if (gameState !== "idle") return;

      gameState = "waiting";
      resetPlayArea();
      statusText.textContent = "準備中… 等靶出現，不要亂點喔！";

      const config = difficultyConfig[currentDifficulty];
      const waitTime = getRandomInt(config.waitMin, config.waitMax);

      setTimeout(() => {
        if (gameState !== "waiting") return;
        showTarget();
      }, waitTime);
    }

    function showTarget() {
      gameState = "ready";
      statusText.textContent = "靶出現了！快點擊哈基米！";
      hintText.style.display = "none";

      const config = difficultyConfig[currentDifficulty];

      targetElement = document.createElement("div");
      targetElement.className = "target";

      const img = document.createElement("img");
      img.src = gifList[Math.floor(Math.random() * gifList.length)];
      img.alt = "Hakimi Target";

      targetElement.appendChild(img);

      const size = config.targetSize;
      targetElement.style.width = size + "px";
      targetElement.style.height = size + "px";

      const areaRect = playArea.getBoundingClientRect();

      const centerWidth = areaRect.width * 0.6;
      const centerHeight = areaRect.height * 0.6;

      const offsetX = (areaRect.width - centerWidth) / 2;
      const offsetY = (areaRect.height - centerHeight) / 2;

      const maxX = centerWidth - size;
      const maxY = centerHeight - size;

      const randomX = offsetX + getRandomInt(0, Math.max(0, maxX));
      const randomY = offsetY + getRandomInt(0, Math.max(0, maxY));

      targetElement.style.left = randomX + "px";
      targetElement.style.top = randomY + "px";

      targetElement.addEventListener("click", onTargetClick);

      playArea.appendChild(targetElement);

      startTime = Date.now();
    }

    function onTargetClick() {
      if (gameState !== "ready") return;

      const endTime = Date.now();
      const reactionTime = endTime - startTime;

      statusText.textContent = `太神啦！你的反應時間是 ${reactionTime} ms`;
      gameState = "idle";

      currentSessionRecords.push({
        time: reactionTime,
        difficulty: difficultyConfig[currentDifficulty].label,
      });
      updateCurrentSessionUI();

      addToBestRecords(
        reactionTime,
        difficultyConfig[currentDifficulty].label
      );

      resetPlayArea();
    }

    function onPlayAreaClick() {
      if (gameState === "waiting") {
        statusText.textContent = "太早了！等靶出現再點啦～";
        gameState = "idle";
        resetPlayArea();
      }
    }

    // ====== 事件 ======
    startButton.addEventListener("click", startGame);

    difficultyButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        setDifficulty(btn.dataset.difficulty);
      });
    });

    playArea.addEventListener("click", onPlayAreaClick);

    updateBestListUI();
    updateCurrentSessionUI();
  </script>
</body>
</html>
